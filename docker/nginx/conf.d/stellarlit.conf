# 独立 nginx:只监听容器内 443,由 compose 映射到宿主机 8443。
# 80/443 被其他项目占用时使用;若能独占 80/443,把映射改成 80:80 / 443:443 即可。
server {
    listen 443 ssl;
    http2 on;
    server_name stellarlit.wenshi.xin;

    ssl_certificate     /etc/nginx/certs/live/stellarlit.wenshi.xin/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/stellarlit.wenshi.xin/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 必须关闭缓冲,否则回答会攒到最后一次性出现
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
